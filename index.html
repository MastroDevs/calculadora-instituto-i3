<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas - Instituto i3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Instituto i3</h2>
        <h3>Calculadora de Notas Académicas</h3>
        <form id="notaForm">
            <label for="nombre">Nombre del Estudiante:</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan Mastrodomenico">

            <label for="nota1">Nota 1 (0 a 5):</label>
            <input type="number" id="nota1" step="0.1" min="0" max="5" required>

            <label for="nota2">Nota 2 (0 a 5):</label>
            <input type="number" id="nota2" step="0.1" min="0" max="5" required>

            <label for="nota3">Nota 3 (0 a 5):</label>
            <input type="number" id="nota3" step="0.1" min="0" max="5" required>

            <button type="button" onclick="calcularPromedio()">Calcular</button>
        </form>
        <div id="resultado" class="resultado hidden"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
